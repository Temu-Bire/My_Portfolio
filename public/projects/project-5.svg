<svg viewBox="0 0 500 310" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#C3D9FA"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E40AF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="310" fill="url(#bg)"/>

  <!-- Window -->
  <rect x="10" y="22" width="480" height="254" rx="10" fill="#fff" filter="url(#sh)"/>
  <path d="M10 32a10 10 0 0 1 10-10h460a10 10 0 0 1 10 10v24H10z" fill="#EFF6FF"/>
  <circle cx="26" cy="39" r="4" fill="#F43F5E"/>
  <circle cx="40" cy="39" r="4" fill="#F59E0B"/>
  <circle cx="54" cy="39" r="4" fill="#10B981"/>

  <!-- Validated pill -->
  <rect x="396" y="30" width="80" height="18" rx="9" fill="#DCFCE7"/>
  <circle cx="408" cy="39" r="3.5" fill="#16A34A"/>
  <text x="416" y="42.5" font-size="9.5" font-weight="600" fill="#166534">Validated</text>

  <!-- Pipeline -->
  <rect x="26" y="64" width="92" height="22" rx="11" fill="#DBEAFE"/>
  <text x="72" y="78.5" font-size="9" font-weight="600" fill="#1E40AF" text-anchor="middle">Collect</text>
  <rect x="144" y="64" width="92" height="22" rx="11" fill="#DBEAFE"/>
  <text x="190" y="78.5" font-size="9" font-weight="600" fill="#1E40AF" text-anchor="middle">Validate</text>
  <rect x="262" y="64" width="92" height="22" rx="11" fill="#DBEAFE"/>
  <text x="308" y="78.5" font-size="9" font-weight="600" fill="#1E40AF" text-anchor="middle">Store</text>
  <rect x="380" y="64" width="92" height="22" rx="11" fill="#2563EB"/>
  <text x="426" y="78.5" font-size="9" font-weight="600" fill="#fff" text-anchor="middle">Analyze</text>

  <g stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round">
    <line x1="122" y1="75" x2="136" y2="75"/>
    <line x1="240" y1="75" x2="254" y2="75"/>
    <line x1="358" y1="75" x2="372" y2="75"/>
  </g>
  <g fill="#60A5FA">
    <polygon points="140,75 134,71.5 134,78.5"/>
    <polygon points="258,75 252,71.5 252,78.5"/>
    <polygon points="376,75 370,71.5 370,78.5"/>
  </g>

  <!-- Current weather card -->
  <rect x="26" y="98" width="150" height="166" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="62" cy="132" r="16" fill="#FBBF24"/>
  <circle cx="74" cy="140" r="10" fill="#fff"/>
  <circle cx="92" cy="139" r="12" fill="#fff"/>
  <ellipse cx="84" cy="146" rx="22" ry="9" fill="#fff"/>
  <text x="40" y="190" font-size="26" font-weight="700" fill="#1E3A8A">24°C</text>
  <text x="40" y="205" font-size="9" fill="#475569">Partly cloudy</text>
  <line x1="40" y1="213" x2="162" y2="213" stroke="#BFDBFE"/>
  <text x="40" y="227" font-size="8" fill="#64748B">Humidity</text>
  <text x="162" y="227" font-size="8" font-weight="600" fill="#1E3A8A" text-anchor="end">62%</text>
  <text x="40" y="241" font-size="8" fill="#64748B">Pressure</text>
  <text x="162" y="241" font-size="8" font-weight="600" fill="#1E3A8A" text-anchor="end">1014 hPa</text>
  <text x="40" y="255" font-size="8" fill="#64748B">Wind</text>
  <text x="162" y="255" font-size="8" font-weight="600" fill="#1E3A8A" text-anchor="end">12 km/h</text>

  <!-- Trend chart card -->
