  <text x="462" y="116" font-size="8" fill="#64748B" text-anchor="end">Last 8 months</text>

  <g stroke="#E2E8F0">
    <line x1="200" y1="140" x2="462" y2="140"/>
    <line x1="200" y1="168" x2="462" y2="168"/>
    <line x1="200" y1="196" x2="462" y2="196"/>
    <line x1="200" y1="224" x2="462" y2="224"/>
  </g>

  <polygon points="206,214 240,200 274,176 308,150 342,142 376,158 410,188 444,206 444,240 206,240" fill="#3B82F6" opacity="0.15"/>
  <line x1="342" y1="146" x2="342" y2="240" stroke="#93C5FD" stroke-dasharray="3 3"/>
  <polyline points="206,214 240,200 274,176 308,150 342,142 376,158 410,188 444,206" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#fff" stroke="#2563EB" stroke-width="2">
    <circle cx="206" cy="214" r="3"/>
    <circle cx="240" cy="200" r="3"/>
    <circle cx="274" cy="176" r="3"/>
    <circle cx="308" cy="150" r="3"/>
    <circle cx="376" cy="158" r="3"/>
    <circle cx="410" cy="188" r="3"/>
    <circle cx="444" cy="206" r="3"/>
  </g>
  <circle cx="342" cy="142" r="4.5" fill="#2563EB"/>
  <rect x="352" y="126" width="46" height="16" rx="5" fill="#1E3A8A"/>
  <text x="375" y="137.5" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">31°C</text>

  <g font-size="7.5" fill="#64748B" text-anchor="middle">
    <text x="206" y="255">Feb</text>
    <text x="240" y="255">Mar</text>
    <text x="274" y="255">Apr</text>
    <text x="308" y="255">May</text>
    <text x="342" y="255">Jun</text>
    <text x="376" y="255">Jul</text>
    <text x="410" y="255">Aug</text>
    <text x="444" y="255">Sep</text>
  </g>

  <!-- Caption -->
  <text x="250" y="296" font-size="10.5" font-weight="500" fill="#1D4ED8" text-anchor="middle">Weather Data Analytics</text>
