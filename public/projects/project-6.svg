<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="#f8fafc"/>
  <rect width="800" height="450" fill="url(#bg6)"/>
  <!-- Pipeline Terminal & Pipeline Stages -->
  <rect x="60" y="50" width="680" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="60" y="50" width="680" height="36" rx="12" fill="#1e293b"/>
  <circle cx="85" cy="68" r="5" fill="#ef4444"/>
  <circle cx="102" cy="68" r="5" fill="#eab308"/>
  <circle cx="119" cy="68" r="5" fill="#22c55e"/>
  <text x="400" y="73" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">ci-cd-pipeline-runner // health-monitor:active</text>

  <!-- CI Pipeline steps -->
  <rect x="90" y="110" width="120" height="70" rx="8" fill="#1e293b" stroke="#22c55e"/>
  <text x="150" y="138" font-family="sans-serif" font-size="12" font-weight="bold" fill="#22c55e" text-anchor="middle">✓ LINT</text>
  <text x="150" y="158" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0 errors</text>

  <line x1="210" y1="145" x2="250" y2="145" stroke="#22c55e" stroke-width="2"/>

  <rect x="250" y="110" width="120" height="70" rx="8" fill="#1e293b" stroke="#22c55e"/>
  <text x="310" y="138" font-family="sans-serif" font-size="12" font-weight="bold" fill="#22c55e" text-anchor="middle">✓ TEST</text>
  <text x="310" y="158" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">24 passed</text>

  <line x1="370" y1="145" x2="410" y2="145" stroke="#22c55e" stroke-width="2"/>

  <rect x="410" y="110" width="120" height="70" rx="8" fill="#1e293b" stroke="#22c55e"/>
  <text x="470" y="138" font-family="sans-serif" font-size="12" font-weight="bold" fill="#22c55e" text-anchor="middle">✓ DOCKER</text>
  <text x="470" y="158" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">built: 12.4s</text>

  <line x1="530" y1="145" x2="570" y2="145" stroke="#22c55e" stroke-width="2"/>

  <rect x="570" y="110" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="640" y="138" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">🚀 DEPLOY</text>
  <text x="640" y="158" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">healthy 99.9%</text>

  <!-- Logs terminal -->
  <rect x="90" y="210" width="620" height="150" rx="6" fill="#020617" stroke="#1e293b"/>
  <text x="110" y="240" font-family="monospace" font-size="12" fill="#38bdf8">$ docker run -d -p 8080:8080 app/service:latest</text>
  <text x="110" y="265" font-family="monospace" font-size="12" fill="#22c55e">[HEALTHCHECK] GET /healthz 200 OK (3ms response)</text>
  <text x="110" y="290" font-family="monospace" font-size="12" fill="#94a3b8">[METRICS] Memory: 142MB / 512MB | CPU: 1.2%</text>
  <text x="110" y="315" font-family="monospace" font-size="12" fill="#e2e8f0">[STATUS] All services operational and monitoring telemetry stream.</text>

  <text x="400" y="420" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Automated CI/CD Pipeline &amp; Health Monitor</text>
</svg>
